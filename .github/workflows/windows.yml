name: Build Windows

# Builds '3D-to-AI-V…-windows-x64.zip' on a Windows server and attaches it to the release.
#  - automatically when a release is published ;
#  - on demand (Actions → Build Windows → Run workflow), with the tag of an existing release to attach the zip to.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to complete (e.g. V26.10.02) ; empty = plain test artifact"
        required: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # version.sh counts the commits of the month
          ref: ${{ env.TAG || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build + self-tests
        shell: bash
        run: ./build_windows.sh

      - name: Archive (zip + interface screenshot)
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.zip
            dist/screenshot-windows.png

      - name: Attach the zip to the release
        if: ${{ env.TAG != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
